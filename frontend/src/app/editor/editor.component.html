<section class="editor-shell">
  <header class="topbar">
    <div class="field-group">
      <label for="snippet-title">Title</label>
      <input
        id="snippet-title"
        type="text"
        [(ngModel)]="title"
        placeholder="Untitled Snippet"
      />
    </div>

    <div class="field-group">
      <label for="snippet-language">Language</label>
      <select id="snippet-language" [(ngModel)]="language">
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="go">Go</option>
      </select>
    </div>

    <button type="button" class="save-btn" [disabled]="isSaving" (click)="saveSnippet()">
      {{ isSaving ? 'Saving...' : 'Save Version' }}
    </button>
  </header>

  <div class="workspace-grid">
    <main class="editor-panel">
      <ngx-monaco-editor
        class="monaco-host"
        [options]="editorOptions"
        [(ngModel)]="code"
        (ngModelChange)="onCodeChanged($event)"
      ></ngx-monaco-editor>
      <p class="status" *ngIf="statusMessage">{{ statusMessage }}</p>
    </main>

    <aside class="history-panel">
      <h3>Version History</h3>
      <ul>
        <li *ngFor="let item of history">
          <span>v{{ item.version }}</span>
          <time>{{ item.timestamp | date: 'medium' }}</time>
        </li>
      </ul>
    </aside>
  </div>
</section>
